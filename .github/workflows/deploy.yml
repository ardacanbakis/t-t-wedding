name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Work out where the site is served from, in priority order:
      #   1. repo Actions Variables (manual override), else
      #   2. a custom domain in public/CNAME (empty base path, https://<domain>), else
      #   3. the GitHub Pages project page (https://<owner>.github.io/<repo>).
      # So adding public/CNAME is all it takes to switch to a custom domain —
      # links and share-preview URLs follow automatically.
      - name: Resolve site URL + base path
        id: site
        env:
          VAR_BASE: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          VAR_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -f public/CNAME ]; then
            DOMAIN="$(tr -d '[:space:]' < public/CNAME)"
          fi
          if [ -n "${DOMAIN:-}" ]; then
            # A custom domain ALWAYS serves from the root, so the base path must
            # be empty — even if an old NEXT_PUBLIC_BASE_PATH repo Variable is
            # still set (that would 404 every asset at the domain root).
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=${VAR_URL:-https://${DOMAIN}}" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=${VAR_BASE:-/${{ github.event.repository.name }}}" >> "$GITHUB_OUTPUT"
            echo "site_url=${VAR_URL:-https://${{ github.repository_owner }}.github.io}" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          # Supabase keys come from Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Resolved above: custom domain (public/CNAME) forces an empty base
          # path; otherwise repo Variables, else the project-page location.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.site_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
